# Publica uma release assinada a cada tag `v*`.
# O tauri-action roda `tauri build`, assina os artefatos com
# TAURI_SIGNING_PRIVATE_KEY e anexa tudo (incluindo latest.json)
# à GitHub Release — é esse latest.json que o app consulta no update.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libappindicator3-dev
          librsvg2-dev
          patchelf

      - name: Install frontend dependencies
        run: npm ci

      # O GitHub não aceita Secret vazio: se a chave não tem senha,
      # cadastre TAURI_SIGNING_PRIVATE_KEY_PASSWORD como "" e este
      # passo normaliza para vazio antes de assinar.
      - name: Normalize signing password
        shell: bash
        run: |
          PWD='${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}'
          if [ "$PWD" = '""' ] || [ "$PWD" = "''" ]; then PWD=''; fi
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PWD" >> "$GITHUB_ENV"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Proge ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
